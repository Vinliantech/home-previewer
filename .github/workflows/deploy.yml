name: Build & Deploy to HostAfrica (Node.js)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Node server
        env:
          NITRO_PRESET: node-server
          NODE_ENV: production
        run: npm run build

      - name: Verify Node server build output
        run: |
          test -f .output/server/index.mjs || {
            echo "Missing .output/server/index.mjs"
            exit 1
          }
          ls -la .output
          ls -la .output/server | head -20

      - name: Stage deployment payload
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp -r .output deploy/.output
          cp package.json deploy/package.json

          if [ -f package-lock.json ]; then
            cp package-lock.json deploy/package-lock.json
          fi

          cat > deploy/app.mjs <<'EOF'
          import "./.output/server/index.mjs";
          EOF

          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt

          ls -la deploy
          test -f deploy/app.mjs
          test -f deploy/.output/server/index.mjs

      - name: Deploy to HostAfrica via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: deploy/
          server-dir: ${{ secrets.FTP_APP_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
